<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر الإكسسوارات | غلافات، موازين، باور بانك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg2:#f6f6f8;--tx:#16161d;--mt:#6b6b7a;--br:#e7e7ee;--ac:#ff2d75;--ac2:#7c3aed;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f0f14;--bg2:#181820;--tx:#f3f3f7;--mt:#a0a0b0;--br:#2a2a35}}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7}
a{color:inherit;text-decoration:none}
.w{max-width:1100px;margin:auto;padding:0 16px}
.bar{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;text-align:center;font-size:13px;padding:6px;font-weight:600}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--br);z-index:9}
header .w{display:flex;justify-content:space-between;align-items:center;height:60px}
.logo{font-weight:800;font-size:22px}.logo b{color:var(--ac)}
.hero{background:linear-gradient(135deg,#ff2d75,#7c3aed);color:#fff;padding:48px 0;text-align:center}
.hero h1{font-size:clamp(26px,5vw,44px);font-weight:800}
.hero p{opacity:.9;margin:10px 0 20px}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px 28px;font:800 17px Cairo,sans-serif;cursor:pointer;width:auto}
.hero .btn{background:#fff;color:var(--ac)}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:24px auto}
.trust div{background:var(--bg2);border-radius:12px;padding:14px;text-align:center;font-weight:600;font-size:14px}
h2{font-size:24px;margin:28px 0 14px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding-bottom:30px}
.card{border:1px solid var(--br);border-radius:16px;overflow:hidden;background:var(--bg);display:block}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg2)}
.card .i{padding:12px}.card h3{font-size:16px}
.pr{color:var(--ac);font-weight:800;font-size:20px}
.old{color:var(--mt);text-decoration:line-through;font-size:14px;margin-inline-start:6px}
.card .btn{width:100%;margin-top:8px;padding:10px;font-size:15px;text-align:center}
.pg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;padding:24px 0}.pg>*{min-width:0}html,body{overflow-x:hidden}img{max-width:100%}#mi{aspect-ratio:1;object-fit:contain;max-height:min(70vh,480px);width:100%}
@media(max-width:760px){.pg{grid-template-columns:minmax(0,1fr);gap:16px;padding:14px 0}header .w{height:auto;min-height:54px;flex-wrap:wrap;gap:6px;padding-top:6px;padding-bottom:6px}}
.gal img{width:100%;border-radius:16px;border:1px solid var(--br);background:var(--bg2)}
.tag{background:#fee2e2;color:#dc2626;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700}
.stars{color:#f59e0b}
ul.f{padding-inline-start:20px;margin:10px 0}
.box{background:var(--bg2);border:1px solid var(--br);border-radius:16px;padding:18px;margin-top:16px}
.box h3{margin-bottom:10px}
label{font-weight:600;font-size:14px;display:block;margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--br);border-radius:10px;background:var(--bg);color:var(--tx);font:16px Cairo,sans-serif}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:14px 0}
.box .btn{width:100%}
.rv{border:1px solid var(--br);border-radius:14px;padding:14px;margin-bottom:10px}
.rv small{color:var(--mt)}
.ok{background:#dcfce7;color:#166534;padding:16px;border-radius:12px;font-weight:700;text-align:center;margin-top:12px}
.er{color:#dc2626;font-size:14px;margin-top:8px}
footer{background:var(--bg2);text-align:center;padding:24px;color:var(--mt);font-size:14px;margin-top:30px}
.tb{width:100%;border-collapse:collapse}.tb td,.tb th{padding:10px;border-bottom:1px solid var(--br);text-align:start}.tb th{background:var(--bg2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{position:relative;margin:0!important;cursor:pointer}.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%}.chip span{display:block;padding:9px 12px;border:1.5px solid var(--br);border-radius:10px;font-size:14px;background:var(--bg)}.chip:has(input:checked) span{background:var(--ac);color:#fff;border-color:var(--ac)}
.th{display:flex;gap:8px;margin-top:8px;overflow-x:auto}.gal .th img{width:68px;height:68px;object-fit:cover;border-radius:10px;cursor:pointer}
.back{display:inline-block;margin-top:16px;color:var(--mt)}
</style>
</head>

 <div style="margin:8px 0"><span class="pr" style="font-size:28px">${p.price} دج</span>${p.old?`<span class="old">${p.old} دج</span> <span class="tag">وفّر ${p.old-p.price} دج</span>`:''}</div>
 <p>${p.desc}</p><ul class="f">${p.feats.map(f=>`<li>${f}</li>`).join('')}</ul>
 <form class="box" id="f"><h3>📦 للطلب أدخل معلوماتك</h3>
 <label>الاسم الكامل</label><input name="الاسم" required>
 <label>رقم الهاتف</label><input name="الهاتف" type="tel" inputmode="numeric" pattern="[0-9+ ]{9,18}" placeholder="مثال: 0550123456" required>
 <label>الولاية</label><select name="الولاية" required><option value="">اختر الولاية</option>${WIL.map((w,i)=>`<option>${i+1} - ${w}</option>`).join('')}</select>
 <label>البلدية</label><input name="البلدية" required>
 <label>طريقة التوصيل</label><select name="نوع التوصيل" id="dt"><option value="للمنزل">🏠 للمنزل</option><option value="مكتب التوصيل">🏢 مكتب التوصيل (Stop Desk)</option></select>
 ${(p.groups||(p.models?[['اختر موديل هاتفك 📱',p.models]]:[])).map(g=>`<label>${g[0]}</label>${chips('الموديل',g[1])}`).join('')}
 ${p.colors?`<label>اللون 🎨</label>${chips('اللون',p.colors)}`:''}
 ${p.askModel?`<label>موديل هاتفك (مثال: iPhone 13 أو Samsung A54)</label><input name="الموديل" required>`:''}
 <label>الكمية</label><input name="الكمية" id="q" type="number" min="${MIN_QTY}" value="${MIN_QTY}" required>
 <div class="tot" style="font-size:15px;font-weight:600;margin-bottom:0"><span>🚚 سعر التوصيل</span><span id="dp">اختر الولاية</span></div><div class="tot"><span>المجموع الكلي</span><span id="t"></span></div>
 <button class="btn" id="s">اطلب الآن — الدفع عند الاستلام</button><div id="m"></div></form></div></div>
 ${p.rev.length?'<h2>آراء العملاء</h2>':''}${p.rev.map(r=>`<div class="rv"><b>${r[0]}</b> <small>— ${r[1]}</small><div class="stars">${stars(r[2])}</div>${r[3]}</div>`).join('')}`;
 const q=$('#q'),t=$('#t'),ws=$('select[name="الولاية"]'),dt=$('#dt'),dp=$('#dp');
 const dfee=()=>{const w=D[ws.selectedIndex-1];return w?(dt.selectedIndex===1?w[2]:w[1]):null};
 const upd=()=>{const w=D[ws.selectedIndex-1];
  if(w){dt.options[0].text='🏠 للمنزل — '+w[1]+' دج';dt.options[1].text=w[2]?'🏢 مكتب التوصيل — '+w[2]+' دج':'🏢 مكتب التوصيل (غير متوفر)';dt.options[1].disabled=!w[2];if(!w[2]&&dt.selectedIndex===1)dt.selectedIndex=0}
  const f=dfee();dp.textContent=f==null?'اختر الولاية':f+' دج';
  t.textContent=(p.price*(+q.value||0)+(f||0)).toLocaleString('en')+' دج'};
 q.oninput=ws.onchange=dt.onchange=upd;upd();
 $('#f').onsubmit=async e=>{e.preventDefault();
  if(+q.value<MIN_QTY){$('#m').innerHTML=`<div class="er">الحد الأدنى للكمية ${MIN_QTY}</div>`;return}
  const f=e.target,add=(n,v)=>{const i=document.createElement('input');i.type='hidden';i.name=n;i.value=v;f.appendChild(i)};
  add('المنتج',p.name);add('السعر للوحدة',p.price+' دج');const fee=dfee();add('سعر التوصيل',fee+' دج');add('المجموع الكلي',(p.price*q.value+fee)+' دج');
  add('_subject','طلب جديد: '+p.name);add('_template','table');add('_captcha','false');
  const g=n=>(f.elements[n]&&f.elements[n].value)||'',tot=p.price*q.value+fee,btn=$('#s'),box=$('#m');
  const ok=()=>{f.innerHTML=`<div class="ok">✅ تم استلام طلبك بنجاح!<br><small>${p.name} × ${q.value} — المجموع ${tot} دج (شامل التوصيل)</small><br>سنتصل بك قريباً لتأكيد الطلب.</div><a class="btn" href="#" onclick="return go('')" style="margin-top:12px;text-align:center;display:block">متابعة التسوق</a>`};
  const fail=()=>{btn.disabled=false;btn.textContent='اطلب الآن — الدفع عند الاستلام';box.innerHTML='<div class="er">تعذّر إرسال الطلب، حاول مرة أخرى.</div>'};
  btn.disabled=true;btn.textContent='جاري الإرسال...';box.innerHTML='';
  const rec={name:g('الاسم').trim(),phone:g('الهاتف').replace(/[\s.\-]/g,'').replace(/^(\+213|00213)/,'0'),wilaya:g('الولاية'),baladiya:g('البلدية').trim(),delivery_type:g('نوع التوصيل'),product:p.name,model:[g('الموديل'),g('اللون')].filter(Boolean).join(' / '),qty:+q.value,unit_price:p.price,delivery_fee:fee,total:tot};
  let dbOk=false,dbNote='قاعدة البيانات غير مربوطة',mailOk=false;
  if(SB_URL&&SB_KEY){try{const r=await fetch(SB_URL+'/rest/v1/orders',{method:'POST',headers:{apikey:SB_KEY,...(SB_KEY.startsWith('sb_')?{}:{Authorization:'Bearer '+SB_KEY}),'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(rec)});
   dbOk=r.ok;dbNote=r.ok?'تم الحفظ في اللوحة':'فشل الحفظ في اللوحة: '+r.status+' '+(await r.text()).slice(0,200);if(!r.ok)console.error(dbNote)}catch(x){dbNote='فشل الاتصال بقاعدة البيانات'}}
  if(KEY){try{const data={};new FormData(f).forEach((v,k)=>{if(k[0]!=='_')data[k]=v});data.access_key=KEY;data.subject='طلب جديد: '+p.name;data['المنتج']=p.name;data['المجموع الكلي']=tot+' دج';data['سعر التوصيل']=fee+' دج';data['حالة الحفظ في اللوحة']=dbNote;
   const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(data)});mailOk=!!(await r.json()).success}catch(x){}}
  dbOk||mailOk?ok():fail()}}
function ph(id){const p=PRODUCTS.find(x=>x.id===id),e=p.name.split(' ').pop();return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="${p.th[4]}" opacity=".15"/><text x="200" y="240" font-size="150" text-anchor="middle">${e}</text></svg>`)}
function ship(){app.innerHTML=`<a class="back" href="#" onclick="return go('')">← العودة للمتجر</a><h2>🚚 أسعار التوصيل لكل ولاية</h2><p style="color:var(--mt)">السعر لكل طلبية، والدفع عند الاستلام. الأسعار تقريبية وقد تختلف حسب شركة التوصيل ووزن الطرد.</p><div style="overflow-x:auto"><table class="tb"><tr><th>الولاية</th><th>للمنزل</th><th>لمكتب التوصيل</th></tr>${D.map((w,i)=>`<tr><td>${i+1} - ${w[0]}</td><td>${w[1]} دج</td><td>${w[2]?w[2]+' دج':'—'}</td></tr>`).join('')}</table></div>`}
function route(id){const h=id||location.hash.slice(1),p=PRODUCTS.find(x=>x.id===h);
 {const R=document.documentElement.style;['--bg','--bg2','--ac'].forEach(k=>R.removeProperty(k))}
 if(h==='shipping'){ship();scrollTo(0,0);return}
 if(p)prod(p);else{home();if(h==='products')$('#products').scrollIntoView();else scrollTo(0,0)}
 if(p)scrollTo(0,0)}
function go(id){try{location.hash=id}catch(e){}route(id);return false}
addEventListener('hashchange',()=>route());route();
</script>
</body>
</html>
